name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Erlaubt dem Workflow, nach GitHub Pages zu deployen
permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein gleichzeitiges Deployment; laufende werden nicht abgebrochen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Voraussetzung: Pages ist einmalig unter
      # Settings -> Pages -> Source = "GitHub Actions" aktiviert.
      # (Auto-Enablement ist nicht möglich, da der GITHUB_TOKEN keine
      #  Admin-Rechte zum Erstellen der Pages-Site besitzt.)
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
