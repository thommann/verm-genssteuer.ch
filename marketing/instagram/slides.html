<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Instagram-Material — Vermögenssteuer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0b1020;
    --white: #ffffff;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: #05070f;
    color: var(--white);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    padding: 40px;
  }
  .gallery { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; }

  /* Instagram Feed-Format 2026: 4:5 Hochformat, 1080 x 1350 px (volle Feed-Breite). */
  .slide {
    position: relative;
    width: 1080px; height: 1350px;
    overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 96px 88px 80px;
    isolation: isolate;
    color: var(--white);
  }
  .slide::before {
    content: ""; position: absolute; inset: 0; z-index: -2;
    background:
      radial-gradient(120% 90% at 18% 8%, var(--g1), transparent 60%),
      radial-gradient(120% 90% at 88% 96%, var(--g2), transparent 62%),
      linear-gradient(150deg, var(--g3), var(--g4));
  }
  .slide::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(180deg, rgba(5,7,15,0.04) 0%, rgba(5,7,15,0) 38%, rgba(5,7,15,0.32) 100%);
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(8px); opacity: 0.45; z-index: -1; pointer-events: none; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 16px;
    text-transform: uppercase; letter-spacing: 0.22em; font-size: 26px; font-weight: 800;
    color: rgba(255,255,255,0.92);
  }
  .eyebrow::before { content: ""; width: 54px; height: 5px; border-radius: 3px; background: var(--white); }
  .index { font-size: 30px; font-weight: 800; letter-spacing: 0.08em; color: rgba(255,255,255,0.78); }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 40px; padding: 40px 0; }

  h1 { font-weight: 900; font-size: 104px; line-height: 1.02; letter-spacing: -0.035em; }
  .slide[data-len="long"] h1 { font-size: 80px; line-height: 1.05; }

  h1 .mark { color: var(--white); }
  .underline {
    background: linear-gradient(180deg, transparent 58%, rgba(255,255,255,0.92) 58%, rgba(255,255,255,0.92) 92%, transparent 92%);
    padding: 0 4px; border-radius: 4px;
  }
  .ink-underline { color: var(--ink); }

  /* Dunkle Variante (z. B. Gold-Hintergrund): Text dunkel, Marker dunkel mit weisser Schrift. */
  .slide.dark h1, .slide.dark .eyebrow { color: var(--ink); }
  .slide.dark .eyebrow::before { background: var(--ink); }
  .slide.dark .foot { border-top-color: rgba(11,16,32,0.32); }
  .slide.dark .brand .name { color: var(--ink); }
  .slide.dark .brand .name span { color: rgba(11,16,32,0.7); }
  .underline.on-dark {
    background: linear-gradient(180deg, transparent 58%, rgba(11,16,32,0.9) 58%, rgba(11,16,32,0.9) 92%, transparent 92%);
    color: #fff;
  }

  .sub { font-size: 38px; font-weight: 600; line-height: 1.4; color: rgba(255,255,255,0.94); max-width: 24ch; }

  /* Kennzahl-Block (Lösung). */
  .statrow { display: flex; gap: 56px; flex-wrap: wrap; align-items: flex-end; }
  .stat { display: flex; flex-direction: column; gap: 8px; }
  .stat .num { font-size: 150px; font-weight: 900; line-height: 0.92; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .stat .num.ink { color: var(--ink); }
  .stat .lab { font-size: 32px; font-weight: 700; color: rgba(255,255,255,0.9); max-width: 16ch; }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 20px; border-top: 2px solid rgba(255,255,255,0.28); padding-top: 34px; }
  .brand { display: inline-flex; align-items: center; gap: 20px; }
  .brand .logo { width: 64px; height: 64px; flex: none; filter: drop-shadow(0 6px 16px rgba(0,0,0,0.35)); }
  .brand .name { font-size: 34px; font-weight: 900; letter-spacing: -0.01em; }
  .brand .name span { display: block; font-size: 24px; font-weight: 600; color: rgba(255,255,255,0.82); letter-spacing: 0.02em; }
  .source { font-size: 23px; font-weight: 600; color: rgba(255,255,255,0.82); text-align: right; max-width: 40ch; line-height: 1.35; }

  /* Cover */
  .slide.cover .body { justify-content: flex-end; gap: 28px; }
  .slide.cover h1 { font-size: 132px; line-height: 1.0; }
  .slide.cover .kicker { font-size: 40px; font-weight: 700; color: rgba(255,255,255,0.95); max-width: 22ch; line-height: 1.3; }
  .swipe { display: inline-flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(255,255,255,0.92); }
  .swipe svg { width: 40px; height: 40px; }

  /* CTA */
  .slide.cta .body { justify-content: center; align-items: center; text-align: center; gap: 40px; }
  .slide.cta h1 { font-size: 96px; }
  .slide.cta .url { font-size: 56px; font-weight: 900; letter-spacing: -0.01em; background: rgba(11,16,32,0.34); border: 2px solid rgba(255,255,255,0.55); border-radius: 999px; padding: 26px 52px; }
  .slide.cta .sub { text-align: center; max-width: 26ch; }

  .cap { width: 1080px; text-align: center; color: #aab4d4; font-size: 22px; font-weight: 700; margin: -22px auto 2px; letter-spacing: 0.04em; }
  .cap b { color: #fff; }
  .cap.main { color: #ff84a6; }

  @media print {
    body { padding: 0; background: #fff; }
    .cap { display: none; }
    .gallery { gap: 0; }
    .slide { page-break-after: always; }
  }
</style>
</head>
<body>
<!--
  Feed-Reihenfolge: Cover, dann abwechselnd HAUPTBOTSCHAFT und je eine andere Aussage
  (jeder 2. Post = Hauptbotschaft), zum Schluss der Call to action. Alle Aussagen der
  Kampagne sind enthalten; das Deck wird unten datengetrieben erzeugt.
-->
<div class="gallery" id="gallery"></div>

<script>
  const pad = (n) => String(n).padStart(2, '0');
  const bgCss = (b) => `--g1:${b[0]}; --g2:${b[1]}; --g3:${b[2]}; --g4:${b[3]};`;
  const foot = (source = '') => `
    <div class="foot">
      <div class="brand"><span class="logo" data-logo></span>
        <span class="name">Vermögenssteuer<span>vermögenssteuer.ch</span></span></div>
      ${source ? `<div class="source">${source}</div>` : ''}
    </div>`;
  const glow = (b) => `<div class="glow" style="width:500px;height:500px;top:-120px;right:-110px;background:${b[1]};"></div>`;

  // Aussage-Slide (Headline + optional Quelle).
  const statement = (n, o) => `
    <div class="cap${o.main ? ' main' : ''}"><b>${pad(n)}</b> · ${o.cap}</div>
    <section class="slide${o.dark ? ' dark' : ''}" id="s${pad(n)}" data-len="long" style="${bgCss(o.bg)}">
      ${glow(o.bg)}
      <div class="top"><div class="eyebrow">${o.eyebrow}</div></div>
      <div class="body"><h1${o.fs ? ` style="font-size:${o.fs}px;line-height:1.06;"` : ''}>${o.html}</h1></div>
      ${foot(o.source)}
    </section>`;

  // Kennzahl-Slide (Lösung: 2 %).
  const statSlide = (n, o) => `
    <div class="cap"><b>${pad(n)}</b> · ${o.cap}</div>
    <section class="slide" id="s${pad(n)}" style="${bgCss(o.bg)}">
      ${glow(o.bg)}
      <div class="top"><div class="eyebrow">${o.eyebrow}</div></div>
      <div class="body">
        <div class="statrow" style="align-items:flex-start;">
          <div class="stat"><span class="num ink">${o.num}</span><span class="lab">${o.lab}</span></div>
        </div>
        <h1 style="font-size:72px;line-height:1.07;">${o.html}</h1>
      </div>
      ${foot(o.source)}
    </section>`;

  const cover = (n) => `
    <div class="cap"><b>${pad(n)}</b> · Cover</div>
    <section class="slide cover" id="s${pad(n)}" style="--g1:#ff2d6b; --g2:#a78bfa; --g3:#d6249f; --g4:#4f8bff;">
      <div class="glow" style="width:520px;height:520px;top:-120px;right:-80px;background:#ffce5c;opacity:.35;"></div>
      <div class="top"><div class="eyebrow">Tax the Rich</div><div class="index">CH</div></div>
      <div class="body">
        <div class="kicker">Warum eine faire Steuer auf die grössten Vermögen uns allen nützt.</div>
        <h1>Wem gehört<br/>die Schweiz?</h1>
        <div class="swipe">Weiterwischen
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
      </div>
      ${foot()}
    </section>`;

  const cta = (n) => `
    <div class="cap"><b>${pad(n)}</b> · Call to action</div>
    <section class="slide cta" id="s${pad(n)}" style="--g1:#ff2d6b; --g2:#4f8bff; --g3:#d6249f; --g4:#7c3aed;">
      <div class="glow" style="width:560px;height:560px;top:-120px;right:-120px;background:#ffce5c;opacity:.35;"></div>
      <div class="glow" style="width:480px;height:480px;bottom:-120px;left:-120px;background:#25e3c8;opacity:.35;"></div>
      <div class="top"><div class="eyebrow">Mach mit</div><div class="index">CH</div></div>
      <div class="body">
        <span class="logo" data-logo style="width:120px;height:120px;"></span>
        <h1>Rechne selbst nach.</h1>
        <div class="sub">Alle Zahlen, Quellen und der interaktive Steuer-Rechner:</div>
        <div class="url">vermögenssteuer.ch</div>
      </div>
      <div class="foot" style="justify-content:center;border-top:none;">
        <div class="source" style="text-align:center;max-width:60ch;">Quellenbasiert · ESTV · WID.world · UBS · Zucman / World Inequality Report</div>
      </div>
    </section>`;

  // Hauptbotschaft, textgleich, nur der Hintergrund wechselt (Varianten A–L).
  const MAIN = {
    main: true,
    cap: '★ Hauptbotschaft',
    eyebrow: 'Darum geht es',
    html: 'Der Grund, dass am <span class="underline ink-underline">Ende des Monats immer weniger übrig</span> bleibt, ist die wachsende Ungleichheit.',
  };
  const MAIN_BG = [
    ['#ff2d6b', '#ff7a33', '#d6249f', '#ff2d6b'], // A pink/orange
    ['#a78bfa', '#ff2d6b', '#7c3aed', '#d6249f'], // B violett/pink
    ['#4f8bff', '#a78bfa', '#3b6fe0', '#7c3aed'], // C blau/violett
    ['#25e3c8', '#4f8bff', '#14c98a', '#3b6fe0'], // D türkis/blau
    ['#d6249f', '#7c3aed', '#ff2d6b', '#4f8bff'], // E magenta/violett
    ['#ff7a33', '#ff2d6b', '#ffb13c', '#d6249f'], // F orange/rot
    ['#4f8bff', '#25e3c8', '#3b6fe0', '#14c98a'], // G blau/türkis
    ['#ff2d6b', '#4f8bff', '#d6249f', '#7c3aed'], // H pink/blau
    ['#14c98a', '#25e3c8', '#14c98a', '#4f8bff'], // I türkis/grün
    ['#7c3aed', '#4f8bff', '#a78bfa', '#3b6fe0'], // J violett/blau
    ['#ff7a33', '#d6249f', '#ffb13c', '#ff2d6b'], // K orange/magenta
    ['#ff2d6b', '#a78bfa', '#d6249f', '#7c3aed'], // L pink/violett
  ];
  const BGNAME = ['A pink/orange', 'B violett/pink', 'C blau/violett', 'D türkis/blau', 'E magenta/violett', 'F orange/rot', 'G blau/türkis', 'H pink/blau', 'I türkis/grün', 'J violett/blau', 'K orange/magenta', 'L pink/violett'];

  // Die übrigen Aussagen, je einmal. Reihenfolge = Inhaltsfluss.
  const OTHERS = [
    { cap: 'Sinkender Lebensstandard', eyebrow: 'Das Problem', bg: ['#ff7a33', '#d6249f', '#ffb13c', '#ff2d6b'],
      html: 'Der Grund für deinen <span class="underline ink-underline">sinkenden Lebensstandard</span> ist die wachsende Ungleichheit.' },
    { cap: 'Schwächelnde Wirtschaft', eyebrow: 'Das Problem', bg: ['#ff7a33', '#ff2d6b', '#ff7a33', '#d6249f'],
      html: 'Der Grund für die <span class="underline ink-underline">schwächelnde Wirtschaft</span> ist die wachsende Ungleichheit.' },
    { cap: 'Nie ein Haus', eyebrow: 'Das Problem', bg: ['#ff2d6b', '#d6249f', '#c01651', '#ff2d6b'],
      html: 'Der Grund, warum du dir wohl nie ein <span class="underline ink-underline">eigenes Haus</span> leisten kannst, ist die wachsende Ungleichheit.' },
    { cap: 'Krankenkassenprämien', eyebrow: 'Das Problem', bg: ['#d6249f', '#ff2d6b', '#7c3aed', '#d6249f'], fs: 62,
      html: 'Der Grund für die <span class="underline ink-underline">steigenden Krankenkassenprämien</span> ist die wachsende Ungleichheit.' },
    { cap: 'Überfüllte Züge und Busse', eyebrow: 'Das Problem', bg: ['#25e3c8', '#4f8bff', '#14c98a', '#4f8bff'],
      html: 'Der Grund für die <span class="underline ink-underline">überfüllten Züge und Busse</span> ist die wachsende Ungleichheit.' },
    { cap: 'Verstopfte Strassen', eyebrow: 'Das Problem', bg: ['#4f8bff', '#a78bfa', '#3b6fe0', '#7c3aed'],
      html: 'Der Grund für die <span class="underline ink-underline">verstopften Strassen</span> ist die wachsende Ungleichheit.' },
    { cap: 'Sinkende Bildungsqualität', eyebrow: 'Das Problem', bg: ['#25e3c8', '#7c3aed', '#14c98a', '#a78bfa'],
      html: 'Der Grund für die <span class="underline ink-underline">sinkende Bildungsqualität</span> ist die wachsende Ungleichheit.' },
    { cap: 'Erfolgsmodell Schweiz in Gefahr', eyebrow: 'Das Problem', bg: ['#ff2d6b', '#ff7a33', '#d6249f', '#ff7a33'],
      html: 'Die wachsende Ungleichheit zerstört das <span class="underline ink-underline">Erfolgsmodell Schweiz</span>.' },
    { cap: 'Mittelstand trägt die grösste Last', eyebrow: 'Das Problem', dark: true, bg: ['#ffce5c', '#ff7a33', '#ffb13c', '#ff7a33'],
      html: 'Der Mittelstand trägt heute die <span class="underline on-dark">grösste Steuerlast</span>.' },
    { cap: 'Milliardäre zahlen halb so viel', eyebrow: 'Die Ungerechtigkeit', bg: ['#a78bfa', '#ff2d6b', '#7c3aed', '#d6249f'],
      source: 'G. Zucman, G20-Report 2024',
      html: 'Milliardäre zahlen nur <span class="underline ink-underline">halb so viel</span> Steuern auf ihr Einkommen wie der Mittelstand.' },
    { cap: 'Warum es der Schweiz gut geht', eyebrow: 'Was funktioniert', bg: ['#14c98a', '#25e3c8', '#14c98a', '#4f8bff'],
      html: 'Der Schweiz geht es so gut, weil wir mit der Vermögenssteuer auch die <span class="underline ink-underline">Superreichen</span> besteuern.' },
    { type: 'stat', cap: '2 % Mindeststeuer', eyebrow: 'Die Lösung', bg: ['#25e3c8', '#4f8bff', '#14c98a', '#4f8bff'],
      num: '2<span style="font-size:80px;">%</span>', lab: 'Mindeststeuer auf Vermögen über 100 Mio.',
      source: 'Modell: G. Zucman, G20-Report 2024',
      html: 'Schon <span class="mark">2 %</span> sorgen dafür, dass Superreiche <span class="underline ink-underline">gleich viel</span> zahlen wie der Durchschnitt.' },
    { cap: 'Niemand wandert aus', eyebrow: 'Der Mythos', bg: ['#3b6fe0', '#a78bfa', '#4f8bff', '#7c3aed'],
      html: 'Wegen <span class="mark">2 %</span> Mindeststeuer wandert <span class="underline ink-underline">niemand</span> aus der schönen Schweiz aus.' },
    { cap: 'Trifft fair Besteuerte nicht', eyebrow: 'Fair bleibt fair', bg: ['#a78bfa', '#25e3c8', '#7c3aed', '#14c98a'],
      html: 'Wer heute schon <span class="underline ink-underline">fair besteuert</span> wird, zahlt mit der Mindeststeuer keinen Franken mehr.' },
  ];

  let n = 1;
  let out = cover(n++);
  OTHERS.forEach((o, i) => {
    // Vor jeder anderen Aussage die Hauptbotschaft (mit wechselndem Hintergrund).
    out += statement(n++, { ...MAIN, bg: MAIN_BG[i % MAIN_BG.length], cap: `★ Hauptbotschaft · BG ${BGNAME[i % BGNAME.length]}` });
    out += o.type === 'stat' ? statSlide(n++, o) : statement(n++, o);
  });
  out += cta(n++);
  document.getElementById('gallery').innerHTML = out;

  // Waage-Logo (aus public/logo.svg), als weisse Variante eingesetzt.
  const LOGO = `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
    <rect width="32" height="32" rx="8" fill="#ffffff"/>
    <rect x="11" y="26.4" width="10" height="2" rx="1" fill="#0b1020"/>
    <rect x="15" y="9" width="2" height="17.4" fill="#0b1020"/>
    <circle cx="16" cy="8.4" r="1.7" fill="#0b1020"/>
    <rect x="5" y="9.1" width="22" height="1.8" rx="0.9" fill="#0b1020"/>
    <line x1="6" y1="10.9" x2="2.5" y2="16.5" stroke="#0b1020" stroke-width="0.9"/>
    <line x1="6" y1="10.9" x2="9.5" y2="16.5" stroke="#0b1020" stroke-width="0.9"/>
    <path d="M2.5 16.5 Q 6 19.8 9.5 16.5 Z" fill="#0b1020"/>
    <line x1="26" y1="10.9" x2="22.5" y2="16.5" stroke="#0b1020" stroke-width="0.9"/>
    <line x1="26" y1="10.9" x2="29.5" y2="16.5" stroke="#0b1020" stroke-width="0.9"/>
    <path d="M22.5 16.5 Q 26 19.8 29.5 16.5 Z" fill="#0b1020"/>
  </svg>`;
  document.querySelectorAll('[data-logo]').forEach((el) => { el.innerHTML = LOGO; });
</script>
</body>
</html>
